  <!-- Google tag (gtag.js) -->
  <script>
    // Secret URL to disable analytics for the developer's devices
    if (window.location.pathname === '/hideanalytics') {
      localStorage.setItem('block_analytics', 'true');
      alert('Google Analytics tracking has been permanently DISABLED for this device.\n\nYou will now be redirected to the home page.');
      window.location.href = '/';
    }

    // Exclude developer's devices from Google Analytics tracking
    if (localStorage.getItem('block_analytics') !== 'true' && window.location.pathname !== '/hideanalytics') {
      const script = document.createElement('script');
      script.async = true;
      script.src = "https://www.googletagmanager.com/gtag/js?id=G-DJK7Z4XC6R";
      document.head.appendChild(script);

      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-DJK7Z4XC6R');
    } else {
      console.log('Google Analytics is disabled on this device.');
    }
  </script>
